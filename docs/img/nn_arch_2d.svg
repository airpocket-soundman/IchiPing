<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" font-family="Hiragino Sans, Yu Gothic UI, Segoe UI, sans-serif">
  <defs>
    <style>
      .title  { font-size: 15px; font-weight: 800; fill: #1a1d23; }
      .layer-input  { fill: #e5e7eb; stroke: #1a1d23; stroke-width: 1.4; }
      .layer-conv   { fill: #6ea8fe; stroke: #1a1d23; stroke-width: 1.4; }
      .layer-pool   { fill: #ff9f1c; stroke: #1a1d23; stroke-width: 1.4; }
      .layer-gap    { fill: #ff7ab6; stroke: #1a1d23; stroke-width: 1.4; }
      .layer-fc     { fill: #7be0a4; stroke: #1a1d23; stroke-width: 1.4; }
      .layer-softmax{ fill: #c2185b; stroke: #1a1d23; stroke-width: 1.4; }
      .layer-label  { font-size: 11px; font-weight: 800; fill: #fff; text-anchor: middle; }
      .layer-input-label { font-size: 11px; font-weight: 800; fill: #1a1d23; text-anchor: middle; }
      .shape  { font-size: 10px; fill: #4b5563; text-anchor: middle; }
      .arrow  { stroke: #1a1d23; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
      .note   { font-size: 10px; fill: #9a3412; font-weight: 700; }
      .npu-box { fill: #fff7ed; stroke: #fed7aa; stroke-width: 1.4; stroke-dasharray: 4 3; }
      .cpu-box { fill: #fef2f2; stroke: #fecaca; stroke-width: 1.4; stroke-dasharray: 4 3; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1d23"/>
    </marker>
  </defs>

  <text class="title" x="500" y="22" text-anchor="middle">案 §3.2: 2D CNN — STFT 画像分類アプローチ（注目候補）</text>

  <rect class="npu-box" x="20" y="50" width="800" height="180" rx="10"/>
  <text x="30" y="68" font-size="10" font-weight="700" fill="#9a3412">MCXN947 NPU (Neutron N1-16, INT8)</text>

  <g transform="translate(35,100)">
    <rect class="layer-input" width="105" height="60" rx="4"/>
    <text class="layer-input-label" x="52" y="22">STFT</text>
    <text class="layer-input-label" x="52" y="38">2D 画像</text>
    <text class="layer-input-label" x="52" y="52">(time×freq)</text>
    <text class="shape" x="52" y="74">(1, 128, 64, 1)</text>
  </g>
  <path class="arrow" d="M144,130 L162,130"/>

  <g transform="translate(163,100)">
    <rect class="layer-conv" width="90" height="60" rx="4"/>
    <text class="layer-label" x="45" y="22">Conv2D</text>
    <text class="layer-label" x="45" y="38">8ch (3×3)</text>
    <text class="layer-label" x="45" y="52">+ ReLU</text>
    <text class="shape" x="45" y="74">(1, 128, 64, 8)</text>
  </g>
  <path class="arrow" d="M257,130 L274,130"/>

  <g transform="translate(275,100)">
    <rect class="layer-pool" width="75" height="60" rx="4"/>
    <text class="layer-label" x="37" y="28">MaxPool</text>
    <text class="layer-label" x="37" y="44">(2×2)</text>
    <text class="shape" x="37" y="74">(1, 64, 32, 8)</text>
  </g>
  <path class="arrow" d="M354,130 L372,130"/>

  <g transform="translate(373,100)">
    <rect class="layer-conv" width="90" height="60" rx="4"/>
    <text class="layer-label" x="45" y="22">Conv2D</text>
    <text class="layer-label" x="45" y="38">16ch (3×3)</text>
    <text class="layer-label" x="45" y="52">+ ReLU</text>
    <text class="shape" x="45" y="74">(1, 64, 32, 16)</text>
  </g>
  <path class="arrow" d="M467,130 L485,130"/>

  <g transform="translate(486,100)">
    <rect class="layer-pool" width="75" height="60" rx="4"/>
    <text class="layer-label" x="37" y="28">MaxPool</text>
    <text class="layer-label" x="37" y="44">(2×2)</text>
    <text class="shape" x="37" y="74">(1, 32, 16, 16)</text>
  </g>
  <path class="arrow" d="M565,130 L583,130"/>

  <g transform="translate(584,100)">
    <rect class="layer-conv" width="90" height="60" rx="4"/>
    <text class="layer-label" x="45" y="22">Conv2D</text>
    <text class="layer-label" x="45" y="38">32ch (3×3)</text>
    <text class="layer-label" x="45" y="52">+ ReLU</text>
    <text class="shape" x="45" y="74">(1, 32, 16, 32)</text>
  </g>
  <path class="arrow" d="M678,130 L696,130"/>

  <g transform="translate(697,100)">
    <rect class="layer-gap" width="105" height="60" rx="4"/>
    <text class="layer-label" x="52" y="28">AvgPool</text>
    <text class="layer-label" x="52" y="44">(32×16) GAP</text>
    <text class="shape" x="52" y="74">(1, 1, 1, 32)</text>
  </g>
  <path class="arrow" d="M806,130 L826,130"/>

  <rect class="cpu-box" x="830" y="50" width="160" height="180" rx="10"/>
  <text x="840" y="68" font-size="10" font-weight="700" fill="#9a3412">Cortex-M33 (CPU)</text>

  <g transform="translate(835,100)">
    <rect class="layer-fc" width="65" height="60" rx="4"/>
    <text class="layer-label" x="33" y="32">FC → 14</text>
    <text class="shape" x="33" y="74">(1, 14)</text>
  </g>
  <path class="arrow" d="M904,130 L920,130"/>

  <g transform="translate(921,100)">
    <rect class="layer-softmax" width="65" height="60" rx="4"/>
    <text class="layer-label" x="33" y="32">Softmax</text>
    <text class="shape" x="33" y="74">14 class</text>
  </g>

  <text x="500" y="252" text-anchor="middle" font-size="11" fill="#1a1d23">
    Linear chirp 中の STFT を 2D 画像（128 時間 × 64 周波数）として食わせ、共鳴ストリーク・モード分裂を 2D CNN が学習
  </text>
  <text x="500" y="268" text-anchor="middle" class="note">
    ※ 入力解像度・チャンネル数は MCU 段階の目標値。初期検討（§0 段 ①）はフル解像度 + 大モデルで上限性能確認から
  </text>
</svg>
