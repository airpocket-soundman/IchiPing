<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="img"
     aria-label="IchiPing v1 本番モデル — Neutron 互換 Conv2D アーキ (v12345_BLJIT XL)">
  <title>IchiPing v1 本番 — Neutron 互換 32-class Conv2D (XL, v12345_BLJIT)</title>
  <defs>
    <marker id="arrNa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6ea8fe"/>
    </marker>
    <linearGradient id="boxGrA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f242d"/>
      <stop offset="100%" stop-color="#181b22"/>
    </linearGradient>
    <linearGradient id="npuBadge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7be0a4"/>
      <stop offset="100%" stop-color="#5fc88a"/>
    </linearGradient>
  </defs>
  <style>
    .box-in    { fill: url(#boxGrA); stroke: #7be0a4; stroke-width: 1.6; }
    .box-conv  { fill: url(#boxGrA); stroke: #6ea8fe; stroke-width: 1.6; }
    .box-bn    { fill: url(#boxGrA); stroke: #8b95a7; stroke-width: 1.2; stroke-dasharray: 3 2; opacity: 0.85; }
    .box-pool  { fill: url(#boxGrA); stroke: #ffb454; stroke-width: 1.6; }
    .box-head  { fill: url(#boxGrA); stroke: #c678dd; stroke-width: 1.8; }
    .box-out   { fill: url(#boxGrA); stroke: #7be0a4; stroke-width: 1.2; }
    .box-fw    { fill: url(#boxGrA); stroke: #ff7ab6; stroke-width: 1.4; }
    .ttl       { fill: #e5e9f0; font-family: 'Hiragino Sans','Yu Gothic UI',sans-serif; font-size: 13px; font-weight: 700; }
    .ttl-s     { fill: #e5e9f0; font-family: 'Hiragino Sans','Yu Gothic UI',sans-serif; font-size: 11.5px; font-weight: 600; }
    .sub       { fill: #8b95a7; font-family: 'JetBrains Mono',Consolas,monospace; font-size: 11px; }
    .sub-s     { fill: #8b95a7; font-family: 'JetBrains Mono',Consolas,monospace; font-size: 10px; }
    .arrow     { stroke: #6ea8fe; stroke-width: 1.8; fill: none; }
    .arrow-fw  { stroke: #ff7ab6; stroke-width: 1.4; fill: none; }
    .legend-t  { fill: #e5e9f0; font-family: 'Hiragino Sans','Yu Gothic UI',sans-serif; font-size: 11px; }
    .shape     { fill: #e5c07b; font-family: 'JetBrains Mono',Consolas,monospace; font-size: 10.5px; font-weight: 600; }
    .npu-pill  { fill: url(#npuBadge); }
    .npu-t     { fill: #0f1115; font-family: 'JetBrains Mono',Consolas,monospace; font-size: 9.5px; font-weight: 700; }
    .params    { fill: #6ea8fe; font-family: 'JetBrains Mono',Consolas,monospace; font-size: 10px; }
  </style>

  <text x="550" y="22" text-anchor="middle" class="ttl" style="font-size:15px">
    IchiPing v1 本番 — Neutron 互換 32-class Conv2D（v12345_BLJIT_XL, MCU 実機 1.89 ms / NPU 7/7 = 100%）
  </text>
  <text x="550" y="40" text-anchor="middle" class="sub-s">
    pc/training/model_32cls_neutron.py — Conv1D を Conv2D (kernel=(1,K)) に統一して NPU 互換、GAP/Linear を AvgPool2D + 1×1 Conv2D に置換
  </text>

  <!-- Input -->
  <rect class="box-in" x="430" y="55" width="240" height="50" rx="8"/>
  <text x="550" y="77" text-anchor="middle" class="ttl">log-mag spectrum</text>
  <text x="550" y="94" text-anchor="middle" class="sub">入力 (B, 1, 1024) float32</text>

  <line class="arrow" x1="550" y1="108" x2="550" y2="130" marker-end="url(#arrNa)"/>

  <!-- Unsqueeze -->
  <rect class="box-bn" x="440" y="132" width="220" height="32" rx="6"/>
  <text x="550" y="152" text-anchor="middle" class="sub">unsqueeze(2) → (B, 1, 1, 1024)</text>

  <line class="arrow" x1="550" y1="166" x2="550" y2="186" marker-end="url(#arrNa)"/>

  <!-- Conv1 -->
  <rect class="box-conv" x="380" y="190" width="340" height="48" rx="8"/>
  <text x="550" y="210" text-anchor="middle" class="ttl">Conv2D 32ch  kernel=(1,16)  stride=(1,4)</text>
  <text x="550" y="228" text-anchor="middle" class="sub">+ BN1 (fold 後 Conv に吸収) + ReLU</text>
  <text x="940" y="216" text-anchor="end" class="shape">→ (B, 32, 1, 253)</text>
  <rect class="npu-pill" x="780" y="200" width="44" height="14" rx="3"/>
  <text x="802" y="211" text-anchor="middle" class="npu-t">NPU</text>

  <line class="arrow" x1="550" y1="240" x2="550" y2="262" marker-end="url(#arrNa)"/>

  <!-- Conv2 -->
  <rect class="box-conv" x="380" y="265" width="340" height="48" rx="8"/>
  <text x="550" y="285" text-anchor="middle" class="ttl">Conv2D 64ch  kernel=(1,8)  stride=(1,4)</text>
  <text x="550" y="303" text-anchor="middle" class="sub">+ BN2 + ReLU</text>
  <text x="940" y="291" text-anchor="end" class="shape">→ (B, 64, 1, 62)</text>
  <rect class="npu-pill" x="780" y="275" width="44" height="14" rx="3"/>
  <text x="802" y="286" text-anchor="middle" class="npu-t">NPU</text>

  <line class="arrow" x1="550" y1="315" x2="550" y2="337" marker-end="url(#arrNa)"/>

  <!-- Conv3 -->
  <rect class="box-conv" x="380" y="340" width="340" height="48" rx="8"/>
  <text x="550" y="360" text-anchor="middle" class="ttl">Conv2D 128ch  kernel=(1,4)  stride=(1,4)</text>
  <text x="550" y="378" text-anchor="middle" class="sub">+ BN3 + ReLU</text>
  <text x="940" y="366" text-anchor="end" class="shape">→ (B, 128, 1, 15)</text>
  <rect class="npu-pill" x="780" y="350" width="44" height="14" rx="3"/>
  <text x="802" y="361" text-anchor="middle" class="npu-t">NPU</text>

  <line class="arrow" x1="550" y1="390" x2="550" y2="412" marker-end="url(#arrNa)"/>

  <!-- Conv4 -->
  <rect class="box-conv" x="380" y="415" width="340" height="48" rx="8"/>
  <text x="550" y="435" text-anchor="middle" class="ttl">Conv2D 128ch  kernel=(1,3)  stride=(1,2)</text>
  <text x="550" y="453" text-anchor="middle" class="sub">+ BN4 + ReLU（空間次元を 7 まで圧縮）</text>
  <text x="940" y="441" text-anchor="end" class="shape">→ (B, 128, 1, 7)</text>
  <rect class="npu-pill" x="780" y="425" width="44" height="14" rx="3"/>
  <text x="802" y="436" text-anchor="middle" class="npu-t">NPU</text>

  <line class="arrow" x1="550" y1="465" x2="550" y2="487" marker-end="url(#arrNa)"/>

  <!-- AvgPool -->
  <rect class="box-pool" x="380" y="490" width="340" height="42" rx="8"/>
  <text x="550" y="510" text-anchor="middle" class="ttl">AvgPool2D  kernel=(1, 7)</text>
  <text x="550" y="525" text-anchor="middle" class="sub">空間次元を 1 に畳む（旧 GAP の NPU 互換版）</text>
  <text x="940" y="514" text-anchor="end" class="shape">→ (B, 128, 1, 1)</text>
  <rect class="npu-pill" x="780" y="498" width="44" height="14" rx="3"/>
  <text x="802" y="509" text-anchor="middle" class="npu-t">NPU</text>

  <line class="arrow" x1="550" y1="534" x2="550" y2="556" marker-end="url(#arrNa)"/>

  <!-- 1x1 Conv head -->
  <rect class="box-head" x="380" y="558" width="340" height="48" rx="8"/>
  <text x="550" y="578" text-anchor="middle" class="ttl">Conv2D 32ch  kernel=(1, 1)  ← classifier head</text>
  <text x="550" y="596" text-anchor="middle" class="sub">Linear(128, 32) 相当を 1×1 Conv2D で実装 → NPU 化可能</text>
  <text x="940" y="584" text-anchor="end" class="shape">→ (B, 32, 1, 1)</text>
  <rect class="npu-pill" x="780" y="568" width="44" height="14" rx="3"/>
  <text x="802" y="579" text-anchor="middle" class="npu-t">NPU</text>

  <line class="arrow" x1="550" y1="608" x2="550" y2="630" marker-end="url(#arrNa)"/>

  <!-- squeeze -->
  <rect class="box-bn" x="440" y="632" width="220" height="32" rx="6"/>
  <text x="550" y="652" text-anchor="middle" class="sub">squeeze(-1).squeeze(-1) → (B, 32)</text>

  <line class="arrow" x1="550" y1="666" x2="550" y2="686" marker-end="url(#arrNa)"/>

  <!-- 32 logits -->
  <rect class="box-out" x="380" y="690" width="340" height="44" rx="6"/>
  <text x="550" y="710" text-anchor="middle" class="ttl-s">32 logits = 5-bit state (h00000..h11111)</text>
  <text x="550" y="725" text-anchor="middle" class="sub-s">INT8 量子化, dequantize は CPU 側で実施</text>

  <!-- Firmware side: 14cls derivation -->
  <rect class="box-fw" x="20" y="690" width="340" height="44" rx="6"/>
  <text x="190" y="708" text-anchor="middle" class="ttl-s">[firmware 内] 14cls = STATE_TO_EQUIV[argmax32]</text>
  <text x="190" y="724" text-anchor="middle" class="sub-s">10_inference が同じ logits から両方の cls を併記</text>
  <line class="arrow-fw" x1="378" y1="712" x2="362" y2="712" marker-end="url(#arrNa)"/>

  <!-- Sidebox: param counts -->
  <rect class="box-conv" x="740" y="240" width="340" height="230" rx="8" opacity="0.85"/>
  <text x="910" y="262" text-anchor="middle" class="ttl-s">パラメータ内訳 (XL)</text>
  <text x="760" y="285" class="params">conv1 (1→32, k=(1,16))     :    544</text>
  <text x="760" y="302" class="params">bn1                        :     64</text>
  <text x="760" y="319" class="params">conv2 (32→64, k=(1,8))     : 16,448</text>
  <text x="760" y="336" class="params">bn2                        :    128</text>
  <text x="760" y="353" class="params">conv3 (64→128, k=(1,4))    : 32,896</text>
  <text x="760" y="370" class="params">bn3                        :    256</text>
  <text x="760" y="387" class="params">conv4 (128→128, k=(1,3))   : 49,280</text>
  <text x="760" y="404" class="params">bn4                        :    256</text>
  <text x="760" y="421" class="params">classifier (128→32, k=1×1) :  4,128</text>
  <text x="760" y="445" class="ttl-s" style="font-size:12px">合計 ~104 K params (INT8 で 108 KB)</text>
  <text x="760" y="460" class="sub-s">推論 1.89 ms / NPU op 比率 7/7 = 100%</text>

  <!-- Sidebox: Neutron 設計上の工夫 -->
  <rect class="box-head" x="20" y="200" width="340" height="270" rx="8" opacity="0.85"/>
  <text x="190" y="222" text-anchor="middle" class="ttl-s">Neutron 互換のために変えた点</text>
  <text x="35" y="245" class="sub-s">1. Conv1D → Conv2D kernel=(1,K)</text>
  <text x="35" y="260" class="sub-s">   ↳ Conv1D は TFLite で Reshape を強制</text>
  <text x="35" y="278" class="sub-s">2. GAP (Mean op) → AvgPool2D</text>
  <text x="35" y="293" class="sub-s">   ↳ Mean は NPU 非対応、AvgPool2D は対応</text>
  <text x="35" y="311" class="sub-s">3. Flatten+Linear → 1×1 Conv2D</text>
  <text x="35" y="326" class="sub-s">   ↳ Linear も NPU 上の効率が悪い</text>
  <text x="35" y="344" class="sub-s">4. unsqueeze は forward 冒頭 1 回だけ</text>
  <text x="35" y="359" class="sub-s">   ↳ グラフ内 Reshape を最小化</text>
  <text x="35" y="377" class="sub-s">5. BN は学習中のみ、export 前に fold</text>
  <text x="35" y="392" class="sub-s">   ↳ fuse_conv_bn_eval で Conv に吸収</text>
  <text x="35" y="410" class="sub-s">6. stride 4,4,4,2 で空間 1024 → 7 に</text>
  <text x="35" y="425" class="sub-s">   ↳ AvgPool kernel ≤ 7 制限に揃える</text>
  <text x="35" y="448" class="ttl-s" style="font-size:12px">結果: NPU 比率 30% → 100%</text>
  <text x="35" y="462" class="sub-s">(旧 IchiPingV1_32cls は GAP/Linear で 30% に留まる)</text>

  <!-- Legend -->
  <rect class="npu-pill" x="30" y="745" width="32" height="11" rx="3"/>
  <text x="46" y="754" text-anchor="middle" class="npu-t">NPU</text>
  <text x="72" y="755" class="legend-t">Neutron NPU で実行される op</text>

  <rect x="370" y="745" width="14" height="11" fill="url(#boxGrA)" stroke="#c678dd" stroke-width="1.8"/>
  <text x="390" y="755" class="legend-t">classifier head (1×1 Conv)</text>

  <rect x="610" y="745" width="14" height="11" fill="url(#boxGrA)" stroke="#ff7ab6" stroke-width="1.4"/>
  <text x="630" y="755" class="legend-t">firmware 側 (CPU)</text>

  <text x="1070" y="755" text-anchor="end" class="sub-s">
    deploy artefact: pinto_neutron_sdk26_03.tflite (108 KB) → model_data.h
  </text>
</svg>
