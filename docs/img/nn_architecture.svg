<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" role="img"
     aria-label="IchiPing v1 1D-CNN — 14-class softmax single head architecture">
  <title>IchiPing v1 NN — 14-class softmax 単ヘッド (情報理論的に最適)</title>
  <defs>
    <marker id="arrNN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6ea8fe"/>
    </marker>
    <linearGradient id="boxGr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f242d"/>
      <stop offset="100%" stop-color="#181b22"/>
    </linearGradient>
  </defs>
  <style>
    .box-in    { fill: url(#boxGr); stroke: #7be0a4; stroke-width: 1.6; }
    .box-conv  { fill: url(#boxGr); stroke: #6ea8fe; stroke-width: 1.6; }
    .box-pool  { fill: url(#boxGr); stroke: #ffb454; stroke-width: 1.6; }
    .box-head  { fill: url(#boxGr); stroke: #c678dd; stroke-width: 1.8; }
    .box-out   { fill: url(#boxGr); stroke: #7be0a4; stroke-width: 1.2; }
    .box-aux   { fill: url(#boxGr); stroke: #8b95a7; stroke-width: 1.2; stroke-dasharray: 4 3; opacity: 0.75; }
    .ttl    { fill: #e5e9f0; font-family: 'Hiragino Sans','Yu Gothic UI',sans-serif; font-size: 13.5px; font-weight: 700; }
    .ttl-s  { fill: #e5e9f0; font-family: 'Hiragino Sans','Yu Gothic UI',sans-serif; font-size: 11.5px; font-weight: 600; }
    .sub    { fill: #8b95a7; font-family: 'JetBrains Mono',Consolas,monospace; font-size: 11px; }
    .sub-s  { fill: #8b95a7; font-family: 'JetBrains Mono',Consolas,monospace; font-size: 10px; }
    .arrow  { stroke: #6ea8fe; stroke-width: 1.8; fill: none; }
    .arrow-dash { stroke: #8b95a7; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
    .legend-t { fill: #e5e9f0; font-family: 'Hiragino Sans','Yu Gothic UI',sans-serif; font-size: 11px; }
    .out-cls { fill: #e5c07b; font-family: 'JetBrains Mono',Consolas,monospace; font-size: 10.5px; font-weight: 600; }
    .note     { fill: #ff7ab6; font-family: 'Hiragino Sans','Yu Gothic UI',sans-serif; font-size: 11px; font-weight: 600; }
  </style>

  <text x="550" y="22" text-anchor="middle" class="ttl" style="font-size:15px">
    IchiPing v1 NN — 14-class softmax 単ヘッド（情報理論的に最適）
  </text>
  <text x="550" y="40" text-anchor="middle" class="sub-s">
    出力エントロピー log₂(14) ≈ 3.81 bit = 観測情報量上限と一致。捏造ビットゼロ。
  </text>

  <!-- Input -->
  <rect class="box-in" x="430" y="60" width="240" height="50" rx="8"/>
  <text x="550" y="82" text-anchor="middle" class="ttl">log-mag spectrum</text>
  <text x="550" y="100" text-anchor="middle" class="sub">shape (B, 1, 1024) — 16 kHz × 2s WAV を整合フィルタ後 FFT</text>

  <line class="arrow" x1="550" y1="113" x2="550" y2="140" marker-end="url(#arrNN)"/>

  <!-- Conv1 -->
  <rect class="box-conv" x="430" y="145" width="240" height="48" rx="8"/>
  <text x="550" y="166" text-anchor="middle" class="ttl">Conv1D 16ch k=16 s=4</text>
  <text x="550" y="184" text-anchor="middle" class="sub">+ BN1 + ReLU → (B, 16, 253)</text>

  <line class="arrow" x1="550" y1="196" x2="550" y2="220" marker-end="url(#arrNN)"/>

  <!-- Conv2 -->
  <rect class="box-conv" x="430" y="225" width="240" height="48" rx="8"/>
  <text x="550" y="246" text-anchor="middle" class="ttl">Conv1D 32ch k=8 s=4</text>
  <text x="550" y="264" text-anchor="middle" class="sub">+ BN2 + ReLU → (B, 32, 62)</text>

  <line class="arrow" x1="550" y1="276" x2="550" y2="300" marker-end="url(#arrNN)"/>

  <!-- Conv3 -->
  <rect class="box-conv" x="430" y="305" width="240" height="48" rx="8"/>
  <text x="550" y="326" text-anchor="middle" class="ttl">Conv1D 64ch k=4 s=2</text>
  <text x="550" y="344" text-anchor="middle" class="sub">+ BN3 + ReLU → (B, 64, 30)</text>

  <line class="arrow" x1="550" y1="356" x2="550" y2="380" marker-end="url(#arrNN)"/>

  <!-- Global average pool -->
  <rect class="box-pool" x="430" y="385" width="240" height="44" rx="8"/>
  <text x="550" y="406" text-anchor="middle" class="ttl">Global Average Pool</text>
  <text x="550" y="421" text-anchor="middle" class="sub">→ (B, 64) 共有 embedding</text>

  <line class="arrow" x1="550" y1="432" x2="550" y2="455" marker-end="url(#arrNN)"/>

  <!-- 14-class softmax head -->
  <rect class="box-head" x="380" y="460" width="340" height="60" rx="8"/>
  <text x="550" y="482" text-anchor="middle" class="ttl">FC 64 → 14 + softmax</text>
  <text x="550" y="500" text-anchor="middle" class="sub">weights 64×14 = 896, bias 14, 計 910 params</text>
  <text x="550" y="515" text-anchor="middle" class="out-cls">出力: P(equiv_class_k | x), k = 1..14</text>

  <!-- 14 class labels -->
  <rect class="box-out" x="80" y="555" width="940" height="55" rx="6"/>
  <text x="550" y="575" text-anchor="middle" class="ttl-s">14 観測等価クラス（観測可能性予言で決まる）</text>
  <text x="550" y="595" text-anchor="middle" class="out-cls">
    A1 (全閉, 16) │ A2 (AB閉/a開, 8) │ B1 B2 B3 B4 (AB開/BC閉, 各 1) │ C1 C2 C3 C4 C5 C6 C7 C8 (AB開/BC開, 各 1)
  </text>

  <!-- Side note: 32-class variant -->
  <rect class="box-aux" x="780" y="460" width="280" height="60" rx="8"/>
  <text x="920" y="480" text-anchor="middle" class="ttl-s">[variant] FC 64 → 32 + softmax</text>
  <text x="920" y="495" text-anchor="middle" class="sub-s">model_32cls.py（科学検証用）</text>
  <text x="920" y="510" text-anchor="middle" class="sub-s">予想 acc ~0.44 で頭打ち</text>
  <line class="arrow-dash" x1="720" y1="490" x2="780" y2="490"/>

  <!-- Legend -->
  <rect x="30" y="630" width="14" height="14" fill="url(#boxGr)" stroke="#6ea8fe" stroke-width="1.6"/>
  <text x="50" y="641" class="legend-t">共有 backbone Conv1D + BN + ReLU</text>

  <rect x="290" y="630" width="14" height="14" fill="url(#boxGr)" stroke="#ffb454" stroke-width="1.6"/>
  <text x="310" y="641" class="legend-t">時間軸圧縮 (GAP)</text>

  <rect x="450" y="630" width="14" height="14" fill="url(#boxGr)" stroke="#c678dd" stroke-width="1.8"/>
  <text x="470" y="641" class="legend-t">本命: 14-class softmax 単ヘッド</text>

  <rect x="720" y="630" width="14" height="14" fill="url(#boxGr)" stroke="#8b95a7" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="740" y="641" class="legend-t">[科学検証用 variant]</text>

  <text x="1070" y="641" text-anchor="end" class="sub-s">
    総 params ~13.7K（INT8 量子化後 ~13.7 KB）
  </text>
</svg>
