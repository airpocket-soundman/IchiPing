  contents:
    document:
      brief: IchiPing — PC-controlled labelled data collector. Integrates the
        SAI1 full-duplex audio path (08), PCA9685 servo bus (02), and ILI9341
        TFT status panel (03). Accepts ASCII commands (PING/GET/SET/SERVO/RUN/
        STOP) and emits multiplexed responses plus ICHP audio frames so
        pc/collector_client.py can save labelled training data.
