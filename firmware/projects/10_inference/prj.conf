# 10_inference — 09_collector のハード一式 (SAI + LPI2C + LPSPI + flashiap) に
# 加えて TFLite Micro + Neutron NPU + CMSIS-DSP (Welch FFT) を有効化。
# サーボは PC からテスト用に動かせるよう LPI2C 入り。
CONFIG_MCUX_COMPONENT_driver.sai=y
CONFIG_MCUX_COMPONENT_driver.lpflexcomm_lpuart=y
CONFIG_MCUX_COMPONENT_driver.lpflexcomm_lpi2c=y
CONFIG_MCUX_COMPONENT_driver.lpflexcomm_lpspi=y
CONFIG_MCUX_COMPONENT_driver.romapi_flashiap=y

# CMSIS-DSP (rFFT for Welch)。実 SDK の Kconfig 名は CMSIS_DSP_Include / _Source。
CONFIG_MCUX_COMPONENT_CMSIS_DSP_Include=y
CONFIG_MCUX_COMPONENT_CMSIS_DSP_Source=y

# TFLite Micro 本体 + Neutron NPU カーネル + CMSIS-NN 高速化。
# .source : TFLite Micro ライブラリをソースからビルド (MicroInterpreter 等)
# .neutron : Neutron NPU 専用 op を tflite に登録 (中で .eiq.neutron を select)
# .cmsis_nn : CPU 側 INT8 op を CMSIS-NN で高速化 (Neutron 非対応 op の fallback で使われる)
CONFIG_MCUX_COMPONENT_middleware.eiq.tensorflow_lite_micro=y
CONFIG_MCUX_COMPONENT_middleware.eiq.tensorflow_lite_micro.source=y
CONFIG_MCUX_COMPONENT_middleware.eiq.tensorflow_lite_micro.neutron=y
CONFIG_MCUX_COMPONENT_middleware.eiq.tensorflow_lite_micro.cmsis_nn=y
